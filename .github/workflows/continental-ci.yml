name: Continental CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continental-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run isolated backend integration tests
        run: python -m pytest tests -q

  frontend:
    name: Frontend regression and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Navigation tests
        run: npm run test:navigation
      - name: Projects tests
        run: npm run test:projects
      - name: Project-evidence workflow tests
        run: npm run test:workflow
      - name: Experience tests
        run: npm run test:experiences
      - name: Skills tests
        run: npm run test:skills
      - name: Certification tests
        run: npm run test:certifications
      - name: Profile tests
        run: npm run test:profile
      - name: ESLint
        run: npm run lint
      - name: Next.js production build
        run: npm run build
      - name: Production-only dependency audit
        run: npm audit --omit=dev
